services:
  - type: web
    name: college-bus-tracker-backend
    runtime: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/bus-tracker-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/buses/stats
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false          # You will fill this in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false          # Set to your Netlify URL e.g. https://your-app.netlify.app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
