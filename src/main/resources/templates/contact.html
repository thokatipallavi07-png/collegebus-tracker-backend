<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact - College Bus Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #1976d2;
        }

        .contact-box {
            background: white;
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        .contact-item {
            margin: 20px 0;
            font-size: 18px;
        }

        .contact-item strong {
            color: #1976d2;
        }

        form {
            margin-top: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h2>🚌 College Bus Tracker</h2>

    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/tracking">Bus Tracking</a>
        <a href="/routes">Routes & Stops</a>
        <a href="/contact">Contact</a>
    </nav>
</header>

<div class="container">

    <h1>📞 Contact Us</h1>

    <div class="contact-box">

        <div class="contact-item">
            📞 <strong>Transport Office:</strong>
            9876543210
        </div>

        <div class="contact-item">
            📧 <strong>Email:</strong>
            transport@college.edu
        </div>

        <div class="contact-item">
            📍 <strong>Address:</strong>
            College Transportation Department
        </div>

        <div class="contact-item">
            🚌 <strong>Bus Support:</strong>
            Contact the transportation office for bus-related issues.
        </div>

        <h2>Send a Message</h2>

        <form>
            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <textarea rows="5" placeholder="Enter your message"></textarea>

            <button type="submit">Send Message</button>
        </form>

    </div>

</div>

</body>
</html>
