
spring.application.name=bus-tracker

# Database — Defaults to in-memory MySQL mode if external MySQL is not configured
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bus_tracker;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Port — Render / Cloud platforms inject PORT automatically
server.port=${PORT:8081}

# Security — override in Render env vars
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Allowed CORS origins — set ALLOWED_ORIGIN to your Netlify URL in Render
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}