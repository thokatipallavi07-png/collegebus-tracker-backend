
spring.application.name=bus-tracker

# Database — set these as environment variables in Render dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bus_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Port — Render injects PORT automatically
server.port=${PORT:8081}

# Security — override in Render env vars
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Allowed CORS origins — set ALLOWED_ORIGIN to your Netlify URL in Render
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}